name: Dedicated Application Build Pipeline
on:
  push:
    branches: [ "main" ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile-and-package:
    name: Build sample output
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Artifact Only
        run: |
          mkdir -p dist
          echo "Build version 1.0.0" > dist/build.info
