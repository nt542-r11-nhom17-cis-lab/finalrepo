name: CIS 1.5 & 2.1 Security Pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secret-scanner:
    timeout-minutes: 15
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run Gitleaks (CIS 1.5.1)
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          sha256sum --check config/gitleaks-8.18.4.sha256
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          mkdir -p reports
          ./gitleaks detect --source . --redact --report-format json --report-path reports/gitleaks.json

      - name: Save redacted Gitleaks evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report-${{ github.run_id }}
          path: reports/gitleaks.json
          if-no-files-found: warn
          retention-days: 7

  ci-pipeline-scanner:
    timeout-minutes: 15
    name: Actionlint CI Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Actionlint CI Scanner (CIS 1.5.2)
        uses: rhysd/actionlint@62dc61a45fc95efe8c800af7a557ab0b9165d63b # v1.7.1

  trivy-comprehensive-scanner:
    timeout-minutes: 15
    name: Trivy Security Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Trivy Vulnerability, IaC & License Scanner (CIS 1.5.3 - 1.5.6)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scanners: 'vuln,misconfig,secret,license'
          scan-ref: '.'
