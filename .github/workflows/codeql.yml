name: CodeQL Python Audit

on:
  push:
    branches:
      - audit/remaining-free-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze Python with CodeQL
    if: >-
      github.repository_id == '1461201903' && startsWith(github.ref, 'refs/heads/audit/') && contains(fromJSON('["357749923","234109911","243073680"]'), github.actor_id) && contains(fromJSON('["hieune-ui","Vuongdlx","HiepTran01"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Upload CodeQL SARIF results for the audited branch.

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require audited build execution identity
        run: python3 scripts/build_access_guard.py

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          build-mode: none

      - name: Analyze and upload results
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:python
          output: reports/codeql

      - name: Save SARIF evidence for analysis review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-python-${{ github.run_id }}
          path: reports/codeql/*.sarif
          if-no-files-found: error
          retention-days: 1
