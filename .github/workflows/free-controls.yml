name: CIS - Free controls evidence

on:
  push:
    branches: [audit/free-controls-completion]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-free-evidence:
    name: Collect scoped Free-control evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record allowlisted build environment evidence
        run: python3 scripts/record_runtime.py

      - name: Test unknown permissions and reject tampered signed bundles
        run: python3 -m unittest discover -s tests -v

      - name: Detect changes in pinned action repository owners
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/monitor_action_owners.py

      - name: Inventory branches and forks without deleting resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/inventory_governance.py

      - name: Package committed source and sign scoped SBOM and provenance
        run: python3 scripts/project_bundle.py

      - name: Collect 48-control read-only evidence and missing prerequisites
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_free_controls.py

      - name: Save scoped evidence separately from runner disk
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: free-controls-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 7
