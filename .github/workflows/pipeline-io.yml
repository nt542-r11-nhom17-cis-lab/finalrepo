name: CIS - Pipeline Input Output

on:
  workflow_dispatch:
  push:
    branches: [audit/free-controls-completion]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-security:
    name: Remediated source and container checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test configuration and audit behavior
        run: python3 -m unittest discover -s tests -v

      - name: Install pinned and hashed Python security tools
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          mkdir -p reports
          python3 -m venv "$RUNNER_TEMP/cis-python-security"
          "$RUNNER_TEMP/cis-python-security/bin/python" -m pip install --require-hashes --cache-dir "$RUNNER_TEMP/cis-pip-cache" -r requirements-security.lock

      - name: Scan Python source for HIGH severity issues
        shell: bash
        run: |
          "$RUNNER_TEMP/cis-python-security/bin/bandit" -r scripts examples database_config.py -lll -f json -o reports/bandit-high.json

      - name: Audit pinned scanner dependencies for known vulnerabilities
        shell: bash
        run: |
          "$RUNNER_TEMP/cis-python-security/bin/pip-audit" -r requirements-security.lock --require-hashes --disable-pip --strict --cache-dir "$RUNNER_TEMP/cis-pip-audit-cache" -f json -o reports/python-package-audit.json

      - name: Require exact vulnerability coverage of all locked packages
        run: python3 scripts/verify_dependency_coverage.py

      - name: Verify locked wheel integrity and inventory license evidence
        run: python3 scripts/audit_python_toolchain.py

      - name: Inventory actual installed dependency relationships
        run: '"$RUNNER_TEMP/cis-python-security/bin/python" scripts/dependency_graph.py'

      - name: Verify graph and signature rejection tests with locked tools
        run: '"$RUNNER_TEMP/cis-python-security/bin/python" -m unittest discover -s tests -v'

      - name: Verify scanner archive and scan current source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cis-source-tools" reports
          cd "$RUNNER_TEMP/cis-source-tools"
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          sha256sum --check "$GITHUB_WORKSPACE/config/gitleaks-8.18.4.sha256"
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/cis-source-tools/gitleaks" detect --no-git --source . --redact --report-format json --report-path reports/current-source-gitleaks.json

      - name: Build the pinned container image
        run: docker build --pull --tag "cis-demo:$GITHUB_SHA" .

      - name: Smoke test with no network and read-only filesystem
        shell: bash
        run: |
          actual=$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges "cis-demo:$GITHUB_SHA")
          test "$actual" = "CIS container lab"
          echo "PASS: unprivileged demo container output verified"

      - name: Verify runtime privilege restrictions and rejected writes
        shell: bash
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges "cis-demo:$GITHUB_SHA" sh -ec '
            test "$(id -u)" != 0
            test "$(awk "/^CapEff:/ {print \$2}" /proc/self/status)" = 0000000000000000
            test "$(awk "/^NoNewPrivs:/ {print \$2}" /proc/self/status)" = 1
            if touch /cis-disallowed-write 2>/dev/null; then
              echo "ERROR: unexpected root filesystem write"
              exit 1
            fi
            echo "PASS: non-root, zero effective capabilities, no-new-privileges, write denied"
          '

      - name: Scan source and IaC with a HIGH or CRITICAL gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret,license
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: reports/trivy-source.json

      - name: Scan built image packages with a HIGH or CRITICAL gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: cis-demo:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: reports/trivy-image.json

      - name: Save remediation security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remediation-security-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  generate-and-validate:
    needs: source-security
    name: Generate SBOM and verify signatures
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      INPUT_MESSAGE: CIS pipeline lab
      OUTPUT_FILE: output/message.txt

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit repository through read-only GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_github.py

      - name: Audit real organization settings without changing them
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_organization.py

      - name: Exercise groups 3 to 5 in an isolated local sandbox
        run: python3 scripts/supply_chain_lab.py

      - name: Validate all-control plans and main push safeguard
        run: python3 -m unittest discover -s tests -v

      - name: Exercise offline registry deny and verification policies
        run: python3 scripts/registry_lab.py

      - name: Inventory pinned action versions and package age evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_dependencies.py

      - name: Verify secret-scanner detection with synthetic fixtures
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cis-tools"
          cd "$RUNNER_TEMP/cis-tools"
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          sha256sum --check "$GITHUB_WORKSPACE/config/gitleaks-8.18.4.sha256"
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          cd "$GITHUB_WORKSPACE"
          python3 scripts/scanner_selftest.py --gitleaks "$RUNNER_TEMP/cis-tools/gitleaks"

      - name: Collect evidence readiness for all 120 controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/audit_all.py

      - name: Save API and sandbox reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cis-review-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Generate and validate output
        shell: bash
        run: |
          mkdir -p output
          printf '%s\n' "$INPUT_MESSAGE" > "$OUTPUT_FILE"
          test -s "$OUTPUT_FILE"
          printf '%s\n' "$INPUT_MESSAGE" | cmp - "$OUTPUT_FILE"
          echo "PASS: output matches input"
          sha256sum "$OUTPUT_FILE"

      - name: Collect runner package inventory
        shell: bash
        run: |
          mkdir -p runner-root/etc runner-root/var/lib/dpkg
          cp /etc/os-release runner-root/etc/os-release
          cp /var/lib/dpkg/status runner-root/var/lib/dpkg/status

      - name: Generate runner package SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: runner-root
          format: spdx-json
          output-file: output/runner-sbom.spdx.json
          syft-version: v1.54.0
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Check SBOM contents
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("output/runner-sbom.spdx.json").read_text()
          )
          packages = data.get("packages", [])
          assert data.get("spdxVersion", "").startswith("SPDX-")
          assert packages, "SBOM contains no packages"

          print("SBOM format:", data["spdxVersion"])
          print("Scope: Ubuntu packages recorded in runner dpkg inventory")
          print("Package count:", len(packages))
          for package in packages[:5]:
              print(
                  "Package:",
                  package.get("name"),
                  package.get("versionInfo", "unknown")
              )
          print("PASS: SBOM JSON parsed and contains packages")
          PY

      - name: Sign artifact and SBOM with temporary lab key
        shell: bash
        run: |
          umask 077
          KEY_FILE="$RUNNER_TEMP/lab-signing-key.pem"
          trap 'rm -f "$KEY_FILE"' EXIT

          openssl genpkey -algorithm RSA \
            -pkeyopt rsa_keygen_bits:3072 \
            -out "$KEY_FILE" 2>/dev/null

          openssl pkey -in "$KEY_FILE" \
            -pubout -out output/lab-public-key.pem

          for file in "$OUTPUT_FILE" output/runner-sbom.spdx.json; do
            openssl dgst -sha256 \
              -sign "$KEY_FILE" \
              -out "$file.sig" "$file"
          done

          echo "PASS: artifact and SBOM signed"

      - name: Verify signatures and reject modified copies
        shell: bash
        run: |
          for file in "$OUTPUT_FILE" output/runner-sbom.spdx.json; do
            echo "Verifying: $file"

            openssl dgst -sha256 \
              -verify output/lab-public-key.pem \
              -signature "$file.sig" "$file"

            echo "PASS: original signature verified for $file"

            MODIFIED_FILE="$RUNNER_TEMP/$(basename "$file").modified"
            cp "$file" "$MODIFIED_FILE"
            printf '\nmodified\n' >> "$MODIFIED_FILE"

            if openssl dgst -sha256 \
              -verify output/lab-public-key.pem \
              -signature "$file.sig" \
              "$MODIFIED_FILE" >/dev/null 2>&1; then
              echo "::error::Modified file passed verification: $file"
              exit 1
            fi

            echo "PASS: modified copy rejected for $file"
          done

      - name: Store signed artifact and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-signed-output-${{ github.run_id }}
          path: |
            output/message.txt
            output/message.txt.sig
            output/runner-sbom.spdx.json
            output/runner-sbom.spdx.json.sig
            output/lab-public-key.pem
          if-no-files-found: error
          retention-days: 7
