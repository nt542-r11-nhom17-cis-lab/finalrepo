name: CIS - Pipeline Security Scan

on:
  workflow_dispatch:
  push:
    branches: [audit/remaining-free-integration]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan-workflow-configuration:
    name: Scan workflow configuration
    if: >-
      github.repository_id == '1461201903' && startsWith(github.ref, 'refs/heads/audit/') && contains(fromJSON('["357749923","234109911","243073680"]'), github.actor_id) && contains(fromJSON('["hieune-ui","Vuongdlx","HiepTran01"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout workflow files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require audited build execution identity
        run: python3 scripts/build_access_guard.py

      - name: Scan workflow security configuration
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github/workflows
          advanced-security: false
          online-audits: true
          persona: auditor
          version: v1.31.1
