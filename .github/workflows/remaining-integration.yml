name: CIS - Remaining Free integrations

on:
  push:
    branches: [audit/remaining-free-integration]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-local-services:
    name: Verify isolated TLS webhook and registry
    if: >-
      github.repository_id == '1461201903' && startsWith(github.ref, 'refs/heads/audit/') && contains(fromJSON('["357749923","234109911","243073680"]'), github.actor_id) && contains(fromJSON('["hieune-ui","Vuongdlx","HiepTran01"]'), github.triggering_actor)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Require audited build execution identity
        run: python3 scripts/build_access_guard.py

      - name: Record sensitive code changes and reject selected workflow risks
        run: python3 scripts/code_change_monitor.py

      - name: Verify policy and failure-path regressions
        run: python3 -m unittest discover -s tests -v

      - name: Validate supplied VM evidence without treating it as remote attestation
        run: |
          python3 scripts/import_vm_evidence.py docs/audit/evidence/vm-lab-results.tar.gz
          cmp reports/vm-evidence/results.json docs/audit/evidence/vm-lab-review.json

      - name: Exercise real HTTPS webhook authentication and replay rejection
        run: python3 scripts/webhook_integration.py

      - name: Exercise pinned registry with TLS and bcrypt authentication
        run: python3 scripts/registry_integration.py

      - name: Scan pinned registry binary for known HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: ${{ runner.temp }}/cis-registry-bin
          scanners: vuln
          list-all-pkgs: 'true'
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: reports/registry-binary-vulnerabilities.json

      - name: Require actual Go binary package coverage
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_registry_scan.py

      - name: Collect pending Free control evidence without administrative writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/audit_pending_free.py --previous docs/audit/evidence/pending-free-baseline.json
          python3 scripts/supplier_intake.py
          python3 scripts/deployment_preflight.py
          python3 scripts/monitor_action_owners.py
          python3 scripts/inventory_governance.py
          python3 scripts/project_bundle.py
          python3 scripts/audit_free_controls.py

      - name: Inventory repositories and access without changing settings
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/inventory_organization.py

      - name: Save integration results without temporary credentials or keys
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remaining-integration-${{ github.run_id }}
          path: |
            reports/action-owners/results.json
            reports/governance/results.json
            reports/project-bundle/
            reports/free-controls/results.json
            reports/free-controls/results.csv
            reports/pending-free/results.json
            reports/supplier-intake/results.json
            reports/deployment-preflight/results.json
            reports/build-access/results.json
            reports/code-monitor/results.json
            reports/vm-evidence/results.json
            reports/webhook-integration/results.json
            reports/registry-integration/results.json
            reports/organization-inventory/results.json
            reports/registry-binary-vulnerabilities.json
            reports/registry-scan-coverage.json
          if-no-files-found: error
          retention-days: 7
