<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="100%" height="100%" fill="#f7f9fc"/>
<text x="500" y="40" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#15334d">Hình 2.1 — Quy trình Manual: Audit–Remediation–Re-audit</text>
<rect x="90" y="70" width="820" height="56" rx="10" fill="#e3effa" stroke="#215881"/>
<text x="500" y="104" text-anchor="middle" font-family="sans-serif" font-size="18">Chọn tiêu chí có hướng dẫn Audit rõ và xác định phạm vi</text>
<path d="M500 128 v26 m-6 -6 l6 6 l6 -6" fill="none" stroke="#215881" stroke-width="2"/>
<rect x="90" y="162" width="820" height="56" rx="10" fill="#e3effa" stroke="#215881"/>
<text x="500" y="196" text-anchor="middle" font-family="sans-serif" font-size="18">Đọc cấu hình / kiểm thử an toàn / lưu bằng chứng</text>
<path d="M500 220 v26 m-6 -6 l6 6 l6 -6" fill="none" stroke="#215881" stroke-width="2"/>
<rect x="90" y="254" width="820" height="56" rx="10" fill="#e3effa" stroke="#215881"/>
<text x="500" y="288" text-anchor="middle" font-family="sans-serif" font-size="18">Đối chiếu yêu cầu CIS và ghi nhận giới hạn</text>
<path d="M500 312 v26 m-6 -6 l6 6 l6 -6" fill="none" stroke="#215881" stroke-width="2"/>
<rect x="90" y="346" width="820" height="56" rx="10" fill="#e3effa" stroke="#215881"/>
<text x="500" y="380" text-anchor="middle" font-family="sans-serif" font-size="18">Khắc phục trong phạm vi được phép: chỉ nhánh hoặc sandbox</text>
<path d="M500 404 v26 m-6 -6 l6 6 l6 -6" fill="none" stroke="#215881" stroke-width="2"/>
<rect x="90" y="438" width="820" height="56" rx="10" fill="#e3effa" stroke="#215881"/>
<text x="500" y="472" text-anchor="middle" font-family="sans-serif" font-size="18">Kiểm tra lại và xuất kết quả; không tự kết luận đạt toàn tiêu chí</text>
</svg>